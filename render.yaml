services:
  - type: web
    name: nexus-public-search-2026
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NEXUS_PUBLIC_MODE
        value: "1"
      - key: NODE_VERSION
        value: "22.14.0"
