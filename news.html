<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS News · Daily Headlines</title><link rel="stylesheet" href="/assets/style.css"><script src="https://unpkg.com/lucide@latest"></script>
<style>
.nxnews{max-width:1420px;margin:auto}.nh-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.nh-title h1{margin:0;font-size:22px;letter-spacing:-.5px}.nh-title p{margin:3px 0 0;font-size:10px;color:#7a8494}.nh-actions{display:flex;align-items:center;gap:6px}.nh-search{height:35px;display:flex;align-items:center;gap:7px;border:1px solid #dfe4ec;border-radius:10px;padding:0 10px;background:#fff;min-width:min(330px,35vw)}.nh-search svg{width:15px;color:#8c96a5}.nh-search input{border:0;outline:0;width:100%;min-width:0;font-size:11px;background:transparent}.nh-btn{height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid #e1e5ec;border-radius:9px;background:#fff;font-size:10px;font-weight:700;color:#344054;cursor:pointer}.nh-btn svg{width:14px}.nh-btn:hover{border-color:#c8bdf5;color:#6337d6}.nh-cats{display:flex;align-items:center;gap:5px;overflow:auto;white-space:nowrap;padding:3px 0 9px;margin-bottom:7px;scrollbar-width:thin}.nh-search-tabs{display:flex;align-items:center;gap:22px;border-bottom:1px solid #e8eaed;margin:-3px 0 12px}.nh-search-tabs a{display:flex;align-items:center;gap:6px;position:relative;padding:8px 3px 11px;color:#5f6368;text-decoration:none;font-size:12px;white-space:nowrap}.nh-search-tabs a svg{width:15px;height:15px}.nh-search-tabs a.active{color:#6337d6;font-weight:700}.nh-search-tabs a.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#6337d6;border-radius:3px}.nh-search-tabs a:hover{color:#202124}@media(max-width:650px){.nh-search-tabs{gap:18px;margin-top:0}.nh-search-tabs a{font-size:11px;padding-bottom:9px}}.nh-cat{height:29px;padding:0 12px;display:inline-flex;align-items:center;border:1px solid transparent;border-radius:17px;background:transparent;color:#667085;font-size:10px;font-weight:700;cursor:pointer}.nh-cat:hover{background:#f3f0ff;color:#6337d6}.nh-cat.active{background:#6337d6;color:#fff;box-shadow:0 3px 10px #6337d62c}.nh-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:9px;color:#8791a1;padding:5px 0 10px}.nh-live{display:inline-flex;align-items:center;gap:5px}.nh-live i{width:6px;height:6px;border-radius:50%;background:#19a974;display:inline-block;box-shadow:0 0 0 3px #e4f8ef}.nh-feed{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:9px;align-items:start}.nh-feature{background:#fff;border:1px solid #e1e6ed;border-radius:13px;overflow:hidden;min-width:0}.nh-feature-art{height:185px;background:linear-gradient(125deg,#25185d,#6337d6 58%,#b5a6ff);display:flex;align-items:flex-end;padding:15px;color:white;position:relative;overflow:hidden}.nh-feature-art:before{content:'N';position:absolute;right:13px;top:-74px;font-size:300px;line-height:1;font-weight:900;opacity:.08}.nh-feature-art .art-label{font-size:9px;letter-spacing:.13em;text-transform:uppercase;font-weight:900;position:relative}.nh-feature-body{padding:14px}.nh-source{display:flex;align-items:center;gap:7px;font-size:9px;font-weight:800;color:#697386;min-width:0}.nh-source-mark{width:23px;height:23px;border-radius:7px;background:#f0ebff;color:#6337d6;display:grid;place-items:center;font-size:10px;font-weight:900;flex:none}.nh-time{color:#939cac;font-size:9px;font-weight:500;margin-left:auto;white-space:nowrap}.nh-feature h2{font-size:20px;line-height:1.25;letter-spacing:-.35px;margin:10px 0 8px}.nh-feature h2 a,.nh-story h3 a{color:#1e293b;text-decoration:none}.nh-feature h2 a:hover,.nh-story h3 a:hover{color:#6337d6}.nh-desc{font-size:11px;line-height:1.55;color:#667085}.nh-open{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:10px;font-weight:800;color:#6337d6;text-decoration:none}.nh-open svg{width:13px}.nh-sidefeed{display:grid;gap:7px}.nh-story{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #e1e6ed;border-radius:10px;padding:10px;min-width:0}.nh-story h3{font-size:12px;line-height:1.35;margin:5px 0 7px;font-weight:750}.nh-story .nh-source-mark{width:20px;height:20px;border-radius:6px;font-size:9px}.nh-story .nh-source{font-size:8px}.nh-miniart{width:64px;height:62px;border-radius:8px;background:linear-gradient(145deg,#e4e9f5,#d8ceff);display:grid;place-items:center;color:#6543ce;font-weight:900;font-size:17px}.nh-section{display:flex;justify-content:space-between;align-items:center;margin:17px 0 8px}.nh-section h2{font-size:14px;margin:0}.nh-section span{font-size:9px;color:#929aaa}.nh-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.nh-card{background:#fff;border:1px solid #e1e6ed;border-radius:10px;overflow:hidden;min-width:0;transition:transform .15s,box-shadow .15s}.nh-card:hover{transform:translateY(-1px);box-shadow:0 8px 22px #1720330c}.nh-card-art{height:70px;background:linear-gradient(115deg,#e7eaff,#f2eeff);display:flex;align-items:center;justify-content:space-between;padding:10px;color:#6d4be0}.nh-card-art strong{font-size:20px;opacity:.6}.nh-card-art span{font-size:8px;letter-spacing:.12em;text-transform:uppercase;font-weight:900}.nh-card-body{padding:10px}.nh-card h3{font-size:12px;line-height:1.4;margin:8px 0 8px}.nh-card p{font-size:10px;line-height:1.45;color:#717c8d;margin:0}.nh-card-foot{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:8px;color:#929aaa}.nh-error,.nh-empty{grid-column:1/-1;background:#fff;border:1px solid #e1e6ed;border-radius:10px;padding:22px;text-align:center;color:#818b9b;font-size:11px}.nh-loading{opacity:.55;pointer-events:none}.nh-footnote{padding:14px 0 4px;text-align:center;color:#a0a8b5;font-size:8px}

@media(max-width:1020px){.nh-feed{grid-template-columns:1fr}.nh-feature-art{height:145px}.nh-sidefeed{grid-template-columns:repeat(2,minmax(0,1fr))}.nh-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nh-feature h2{font-size:18px}}

@media(max-width:370px){.nh-sidefeed{grid-template-columns:1fr}.nh-feature-art{height:90px}.nh-grid{grid-template-columns:1fr}.nh-card{grid-template-columns:60px 1fr}}

</style></head>
<body class="suitebody nexus-google-ui"><main class="suitewrap"><div class="nxnews">
<section class="nh-head"><div class="nh-title"><h1>NEXUS News</h1><p>Daily headlines from India and around the world</p></div><div class="nh-actions"><label class="nh-search"><i data-lucide="search"></i><input id="q" placeholder="Search today's news…"><button id="clearQ" class="nh-btn" style="height:24px;padding:0 5px;display:none" aria-label="Clear search"><i data-lucide="x"></i></button></label><button id="refresh" class="nh-btn"><i data-lucide="refresh-cw"></i><span>Refresh</span></button></div></section>
<nav class="nh-search-tabs" id="newsSearchTabs" aria-label="Search category"><a href="/" data-kind="web"><i data-lucide="search"></i>All</a><a href="/images" data-kind="images"><i data-lucide="images"></i>Images</a><a href="/videos" data-kind="videos"><i data-lucide="play-square"></i>Videos</a><a href="/maps" data-kind="maps"><i data-lucide="map-pinned"></i>Maps</a><a href="/news" class="active" data-kind="news"><i data-lucide="newspaper"></i>News</a></nav>
<nav class="nh-cats" id="cats" aria-label="News categories"><button class="nh-cat active" data-cat="top">Top stories</button><button class="nh-cat" data-cat="india">India</button><button class="nh-cat" data-cat="world">World</button><button class="nh-cat" data-cat="business">Business</button><button class="nh-cat" data-cat="technology">Technology</button><button class="nh-cat" data-cat="science">Science</button><button class="nh-cat" data-cat="sports">Sports</button><button class="nh-cat" data-cat="entertainment">Entertainment</button><button class="nh-cat" data-cat="health">Health</button></nav>
<div class="nh-meta"><span class="nh-live"><i></i><span id="status">Loading today's headlines…</span></span><span id="updated">Last 24 hours · India edition</span></div>
<section id="feature" class="nh-feed"></section>
<section class="nh-section"><h2 id="moreTitle">More headlines</h2><span id="count"></span></section>
<section id="more" class="nh-grid"></section>
<div class="nh-footnote">Headlines provided by Google News RSS · stories open at the linked publisher/feed source. NEXUS does not write or alter news.</div>
</div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fmtTime=d=>{if(!d)return'Latest';const n=Date.now()-new Date(d).getTime();if(!Number.isFinite(n)||n<0)return'Latest';const m=Math.floor(n/60000);if(m<1)return'Just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return new Date(d).toLocaleDateString()};
let category=new URLSearchParams(location.search).get('category')||'top',query=new URLSearchParams(location.search).get('q')||'',data=null,busy=false;
const initials=s=>String(s||'N').replace(/^www\./,'').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
function source(item){return '<span class="nh-source-mark">'+esc(initials(item.source))+'</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(item.source||'News source')+'</span><time class="nh-time">'+esc(fmtTime(item.publishedAt))+'</time>'}
function storyTitle(item){return '<a href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer">'+esc(item.title)+'</a>'}
function storyDescription(item){return item.description?'<p>'+esc(item.description)+'</p>':''}
function renderNews(){
 const rows=data?.results||[];const top=rows[0];
 $('status').textContent=data?.error?'News feed is temporarily unavailable':rows.length+' headlines · latest 24 hours';
 $('updated').textContent='Updated '+new Date(data?.fetchedAt||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · '+(data?.provider||'Google News');
 if(!rows.length){$('feature').innerHTML='<div class="nh-error"><b>No headlines loaded.</b><p>'+(data?.error?esc(data.error):'No matching stories were returned for this topic.')+'</p><button class="nh-btn" onclick="loadNews(true)">Try again</button></div>';$('more').innerHTML='';$('count').textContent='0 stories';return}
 const art=top.image?'<img src="'+esc(top.image)+'" alt="" style="width:100%;height:100%;object-fit:cover">':'<div class="art-label">TOP STORY · NEXUS NEWS</div>';
 $('feature').innerHTML='<article class="nh-feature"><div class="nh-feature-art">'+art+'</div><div class="nh-feature-body"><div class="nh-source">'+source(top)+'</div><h2>'+storyTitle(top)+'</h2>'+storyDescription(top)+'<a class="nh-open" href="'+esc(top.url)+'" target="_blank" rel="noopener noreferrer">Read full story '+String.fromCharCode(8599)+'</a></div></article><div class="nh-sidefeed">'+rows.slice(1,5).map((x,i)=>'<article class="nh-story"><div><div class="nh-source">'+source(x)+'</div><h3>'+storyTitle(x)+'</h3><div class="nh-footnote" style="text-align:left;padding:0">'+(x.description?esc(x.description.slice(0,125)):'Open the linked publisher for the full report.')+'</div></div><div class="nh-miniart">'+esc(initials(x.source))+'</div></article>').join('')+'</div>';
 const rest=rows.slice(5);$('more').innerHTML=rest.map((x,i)=>'<article class="nh-card"><div class="nh-card-art"><span>'+(i%2?'LATEST UPDATE':'NEWS BRIEF')+'</span><strong>'+esc(initials(x.source))+'</strong></div><div class="nh-card-body"><div class="nh-source">'+source(x)+'</div><h3>'+storyTitle(x)+'</h3>'+storyDescription(x)+'<div class="nh-card-foot"><span>'+esc(fmtTime(x.publishedAt))+'</span><span>·</span><span>From publisher feed</span></div></div></article>').join('');
 $('count').textContent=rows.length+' stories';
 if(window.lucide)lucide.createIcons();
}
async function loadNews(force=false){if(busy)return;busy=true;$('feature').classList.add('nh-loading');$('status').textContent='Fetching fresh headlines…';try{const u='/api/daily-news?'+new URLSearchParams({category,q:query,...(force?{refresh:'1'}:{})});data=await(await fetch(u,{cache:'no-store'})).json();if(!data.error){const p=new URLSearchParams();if(category!=='top')p.set('category',category);if(query)p.set('q',query);history.replaceState(null,'',location.pathname+(p.toString()?'?'+p.toString():''))}renderNews()}catch(e){data={error:e.message,results:[]};renderNews()}finally{$('feature').classList.remove('nh-loading');busy=false}}
function setCategory(v){category=v;document.querySelectorAll('.nh-cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===v));$('moreTitle').textContent=(v==='top'?'More headlines':v[0].toUpperCase()+v.slice(1)+' headlines');loadNews()}
document.querySelectorAll('.nh-cat').forEach(b=>b.onclick=()=>setCategory(b.dataset.cat));
document.querySelectorAll('#newsSearchTabs a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const qNow=$('q').value.trim()||query,dest=a.dataset.kind,base=dest==='images'?'/images':dest==='videos'?'/videos':dest==='maps'?'/maps':dest==='news'?'/news':(qNow?'/search':'/');location.href=base+(qNow?'?q='+encodeURIComponent(qNow):'')}));
$('q').value=query;$('q').oninput=()=>{$('clearQ').style.display=$('q').value?'inline-flex':'none'};$('q').onkeydown=e=>{if(e.key==='Enter'){query=$('q').value.trim();loadNews(true)}};$('clearQ').onclick=()=>{query='';$('q').value='';$('clearQ').style.display='none';loadNews(true)};$('refresh').onclick=()=>loadNews(true);
if(!document.querySelector('.nh-cat[data-cat="'+category+'"]'))category='top';document.querySelectorAll('.nh-cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===category));loadNews();setInterval(()=>{if(!document.hidden)loadNews()},300000);if(window.lucide)lucide.createIcons();
</script><link rel="stylesheet" href="/assets/google-ui.css">
</body></html>
